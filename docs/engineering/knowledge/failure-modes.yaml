schema_version: 1
last_verified: 2026-10-22
# status: open | mitigated | tested. Evidence is code reading unless a test is named.
failure_modes:
  - {id: FM-001, trigger: "quality command, npm ci lifecycle script or model-written test runs", effect: "child inherits full process.env incl. ORCHESTRATOR_API_TOKEN, PAPERCLIP_API_TOKEN, OPENROUTER_API_KEY (only providers.cliProviderEnvironment strips OPENROUTER, and only for CLI providers)", evidence: "src/activities.ts:69 spawn without env; src/providers.ts:100", mitigation: "scoped child env allow-list", test: "B-001", status: open}
  - {id: FM-002, trigger: "publish after agent run", effect: "git add --all commits whatever the agent left (secret files, node_modules if not ignored) and pushes to GitHub with no scan", evidence: "src/workspaces.ts:79", mitigation: "pre-publish gate for sensitive paths, secret patterns, oversize files", test: "B-002", status: open}
  - {id: FM-003, trigger: "workflow cancel or worker shutdown during a provider run", effect: "no heartbeat so cancellation is never delivered; provider child keeps editing the worktree until startToClose (16 min)", evidence: "no heartbeat in src; workflows.ts:9; providers.ts:116; Temporal docs: cancellation needs heartbeats", mitigation: "heartbeat and kill child on cancel", test: "B-004", status: open}
  - {id: FM-004, trigger: "auth, validation or invalid-result error in an activity", effect: "all errors retried (maximumAttempts 2), re-spending model cost; no non-retryable classification", evidence: "workflows.ts:9-11, activities.ts:165,171", mitigation: "ApplicationFailure.nonRetryable for auth/config/schema errors", test: "B-005", status: open}
  - {id: FM-005, trigger: "stuck or runaway run", effect: "no workflowExecutionTimeout, approval wait has no timeout, no token/cost/time budget", evidence: "client.ts:16; workflows.ts:188", mitigation: "execution timeout, approval timeout, run budget", test: "B-006", status: open}
  - {id: FM-006, trigger: "worker killed after provider finished, before result recorded", effect: "activity re-executed: duplicate model spend and implement re-run on a modified worktree", evidence: "executeStage has no reuse of an existing stage artifact", mitigation: "reuse artifact when input hash matches", test: "B-007", status: open}
  - {id: FM-007, trigger: "failed or completed run", effect: "worktrees under data/worktrees never removed: disk growth, stale branch collisions", evidence: "no git worktree remove in src", mitigation: "cleanup command", test: "B-010", status: open}
  - {id: FM-008, trigger: "duplicate start for same workflow id", effect: "AlreadyStarted swallowed; response returns a NEW random runId unrelated to the live run", evidence: "client.ts:12-19", mitigation: "return runId of existing execution", test: "B-008", status: open}
  - {id: FM-009, trigger: "any bridge caller holding the token", effect: "test-injection flags accepted in production; request body unbounded; bearer compared with !==", evidence: "src/server.ts:29,32,38", mitigation: "gate flags behind env, body cap, timingSafeEqual", test: "B-003", status: open}
  - {id: FM-010, trigger: "repo, spec or issue text containing instructions", effect: "prompt injection reaches implement stage (workspace-write / acceptEdits); prompts do not mark content as data", evidence: "providers.ts:113", mitigation: "untrusted-content preamble in prompts", test: "B-009", status: open}
  - {id: FM-011, trigger: "non-npm project", effect: "dependency prep skipped; quality executables limited to node|npm|pnpm|yarn", evidence: "activities.ts:81-97; contracts.ts:52", mitigation: "toolchain profiles", status: open}
  - {id: FM-012, trigger: "no CI", effect: "typecheck and tests never enforced", evidence: ".github absent", mitigation: "GitHub Actions workflow", test: "B-012", status: open}
  - {id: FM-013, trigger: "editing workflow code with in-flight runs", effect: "possible non-determinism; no replay test or patching policy", evidence: "no replay tests in test/", mitigation: "replay test plus versioning note", test: "B-011", status: open}
  - {id: FM-014, trigger: "syncMergedStack", effect: "rebase and push --force-with-lease on child branch (human-invoked, by design)", evidence: "workspaces.ts:118", mitigation: "document in runbook", status: open}
