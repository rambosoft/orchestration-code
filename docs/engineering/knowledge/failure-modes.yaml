schema_version: 1
last_verified: 2026-10-22
# status: open | mitigated | tested. Evidence is code reading unless a test is named.
failure_modes:
  - {id: FM-001, trigger: "quality command, npm ci lifecycle script or model-written test runs", effect: "child inherits full process.env incl. ORCHESTRATOR_API_TOKEN, PAPERCLIP_API_TOKEN, OPENROUTER_API_KEY (only providers.cliProviderEnvironment strips OPENROUTER, and only for CLI providers)", evidence: "src/activities.ts:69 spawn without env; src/providers.ts:100", mitigation: "scoped child env allow-list", test: "B-001", status: tested}
  - {id: FM-002, trigger: "publish after agent run", effect: "git add --all commits whatever the agent left (secret files, node_modules if not ignored) and pushes to GitHub with no scan", evidence: "src/workspaces.ts:79", mitigation: "pre-publish gate for sensitive paths, secret patterns, oversize files", test: "B-002", status: tested}
  - {id: FM-003, trigger: "workflow cancel or worker shutdown during a provider run", effect: "no heartbeat so cancellation is never delivered; provider child keeps editing the worktree until startToClose (16 min)", evidence: "no heartbeat in src; workflows.ts:9; providers.ts:116; Temporal docs: cancellation needs heartbeats", mitigation: "heartbeat and kill child on cancel", test: "B-004", status: tested}
  - {id: FM-004, trigger: "auth, validation or invalid-result error in an activity", effect: "all errors retried (maximumAttempts 2), re-spending model cost; no non-retryable classification", evidence: "workflows.ts:9-11, activities.ts:165,171", mitigation: "ApplicationFailure.nonRetryable for auth/config/schema errors", test: "B-005", status: tested}
  - {id: FM-005, trigger: "stuck or runaway run", effect: "no workflowExecutionTimeout, approval wait has no timeout, no token/cost/time budget", evidence: "client.ts:16; workflows.ts:188", mitigation: "execution timeout, approval timeout, run budget", test: "B-006", status: mitigated-partial (time only; no token budget)}
  - {id: FM-006, trigger: "worker killed after provider finished, before result recorded", effect: "activity re-executed: duplicate model spend and implement re-run on a modified worktree", evidence: "executeStage has no reuse of an existing stage artifact", mitigation: "reuse artifact when input hash matches", test: "B-007", status: tested}
  - {id: FM-007, trigger: "failed or completed run", effect: "worktrees under data/worktrees never removed: disk growth, stale branch collisions", evidence: "no git worktree remove in src", mitigation: "cleanup command", test: "B-010", status: open}
  - {id: FM-008, trigger: "duplicate start for same workflow id", effect: "AlreadyStarted swallowed; response returns a NEW random runId unrelated to the live run", evidence: "client.ts:12-19", mitigation: "return runId of existing execution", test: "B-008", status: tested}
  - {id: FM-009, trigger: "any bridge caller holding the token", effect: "test-injection flags accepted in production; request body unbounded; bearer compared with !==", evidence: "src/server.ts:29,32,38", mitigation: "gate flags behind env, body cap, timingSafeEqual", test: "B-003", status: tested}
  - {id: FM-010, trigger: "repo, spec or issue text containing instructions", effect: "prompt injection reaches implement stage (workspace-write / acceptEdits); prompts do not mark content as data", evidence: "providers.ts:113", mitigation: "untrusted-content preamble in prompts", test: "B-009", status: tested}
  - {id: FM-011, trigger: "non-npm project", effect: "dependency prep skipped; quality executables limited to node|npm|pnpm|yarn", evidence: "activities.ts:81-97; contracts.ts:52", mitigation: "toolchain profiles", status: open}
  - {id: FM-012, trigger: "no CI", effect: "typecheck and tests never enforced", evidence: ".github absent", mitigation: "GitHub Actions workflow", test: "B-012", status: open}
  - {id: FM-013, trigger: "editing workflow code with in-flight runs", effect: "possible non-determinism; no replay test or patching policy", evidence: "no replay tests in test/", mitigation: "replay test plus versioning note", test: "B-011", status: tested}
  - {id: FM-014, trigger: "syncMergedStack", effect: "rebase and push --force-with-lease on child branch (human-invoked, by design)", evidence: "workspaces.ts:118", mitigation: "document in runbook", status: open}
  - {id: FM-015, trigger: "cancel on POSIX host or non-stage activities", effect: "only direct child is killed on POSIX (no process group); prepareProjectDependencies/publish activities never heartbeat so they ignore cancel", evidence: "review of B-004 (src/process-control.ts)", mitigation: "detached process groups if a POSIX worker is ever used; host worker is Windows (taskkill /T)", status: open}
  - {id: FM-016, trigger: "private npm registry needing NPM_TOKEN", effect: "childEnv strips NPM_TOKEN so npm ci fails; deliberate trade-off", evidence: "src/env.ts", mitigation: "pass via keep list when a project needs it", status: accepted}
  - {id: FM-017, trigger: "LLM-authored OpenSpec uses the wrong delta format", effect: "strict validation killed the whole run (task 1 and 2 attempts)", evidence: "e2e dino-runner", mitigation: "format rule in proposal prompt, one repair pass with validator diagnostics, non-retryable validation errors", test: "test/openspec-repair.test.ts, test/openspec.test.ts", status: tested}
  - {id: FM-018, trigger: "delta spec MODIFIED/REMOVED/RENAMED of a requirement missing from the main spec, or ADDED duplicate", effect: "archive failed only after implement and review", evidence: "e2e dino-runner task 2", mitigation: "findDeltaProblems at validation time plus archive-time repair", test: "test/openspec-delta.test.ts", status: tested}
  - {id: FM-019, trigger: "plan or digest large but valid", effect: "brief or digest budget unsatisfiable by compression", evidence: "e2e task 2 (848 over 800) and task 3 (1824 over 1400)", mitigation: "derived caps, invariants test, 1.5x hard ceiling for the brief", test: "test/handoffs.test.ts", status: tested}
  - {id: FM-020, trigger: "implementing agent runs the OpenSpec archive skill itself", effect: "orchestrator archive step found no change", evidence: "e2e task 1 attempt 1", mitigation: "idempotent archive (date-prefixed names) and prompt forbids it", test: "test/openspec.test.ts", status: tested}
  - {id: FM-021, trigger: "checklist items that need a browser or manual check", effect: "archive blocked by unticked boxes nobody can tick unattended", evidence: "e2e task 1 attempt 3", mitigation: "proposal prompt avoids such checkboxes, one reconcile pass writes Unverified-manually notes", test: "test/openspec-repair.test.ts", status: tested}
  - {id: FM-022, trigger: "version manager re-creates the symlinked node path during a run", effect: "spawn node.exe ENOENT in any stage", evidence: "e2e task 1 attempt 4, task 2 attempt 2", mitigation: "NODE_EXECUTABLE is the realpath at startup", test: "test/node-path.test.ts", status: mitigated}
  - {id: FM-023, trigger: "code edited but worker or bridge not rebuilt and restarted", effect: "runs silently use old code", evidence: "manual rebuild and restart needed after every fix", mitigation: "doctor build-staleness warning, restart procedure in the runbook", test: "test/doctor.test.ts", status: detected-not-prevented}
  - {id: FM-024, trigger: "host worker process dies or was never started", effect: "workflows wait forever with no error", evidence: "doctor found no pollers after the e2e", mitigation: "doctor worker check, run-worker.ps1 no longer needs npm on PATH, supervision still open (B-027)", test: "test/doctor.test.ts", status: detected-not-prevented}
  - {id: FM-025, trigger: "Windows-style paths resolved with POSIX semantics in the Linux bridge", effect: "wrong project root passed to the Windows worker; CI failure", evidence: "CI run 39858096121, src/project-roots.ts", mitigation: "pathApiFor() win32 resolution for all root sources", test: "test/core.test.ts", status: tested}
  - {id: FM-026, trigger: "claude implement is allowed Bash(npm:*) and Bash(node:*)", effect: "agent can run arbitrary code and install packages in the worktree, with a scrubbed but provider-credentialed environment", evidence: "src/providers.ts claudeExecutionArgs", mitigation: "scrubbed env, publish guard, spend cap; sandbox deferred (B-022)", status: accepted-risk}
  - {id: FM-027, trigger: "scripted source edits that match nothing or mangle escapes", effect: "a claimed change is absent, or control characters end up in regexes", evidence: "this mission (delta-format prompt sentence, word-boundary regexes)", mitigation: "prompt-content tests, scripts/check-control-chars.mjs in CI", test: "test/openspec.test.ts", status: tested}
  - {id: FM-028, trigger: "Windows checkout with core.autocrlf=true (CRLF working files, LF index) inspected by git inside the Linux bridge container", effect: "admission rejected a clean project as modified (36 files) right after the user merged and pulled the PRs", evidence: "e2e DINO-4 first attempt; docker exec git ls-files --eol showed i/lf w/crlf", mitigation: "dirtyEntries(): modified files count only when they differ from HEAD ignoring CR-at-EOL; untracked, deleted, added, renamed still dirty", test: "test/workspaces.test.ts", status: tested}
  - {id: FM-029, trigger: "secrets or credential files committed to the orchestrator repo itself", effect: "published to a public GitHub repo", evidence: "no repo-wide scan existed", mitigation: "npm run scan:secrets in CI reusing the publish-guard patterns", test: "manual probe (planted token detected); pattern tests in test/publish-guard.test.ts", status: mitigated}
  - {id: FM-030, trigger: "codex or claude reviewer returns needs_changes with blocking findings", effect: "verdict never parsed for CLI providers, so nothing blocked and flawed code was published", evidence: "src/providers.ts parsed reviews only for OpenRouter; e2e review artifacts had no review object", mitigation: "applyReviewAssessment for every provider; unreadable review gets one restatement then fails closed", test: "test/chaos.test.ts review gate, test/robustness.test.ts", status: tested}
  - {id: FM-031, trigger: "project without quality commands, or second model verify call", effect: "deterministic verification passed vacuously; a model verify call that can only pass wasted a minute per task", evidence: "src/activities.ts verify path for provider fake with zero checks", mitigation: "refuse code tasks without quality commands at admission and workflow start; skip the model verify call", test: "test/chaos.test.ts 'refused up front'", status: tested}
  - {id: FM-032, trigger: "model adds extra keys, returns a scalar for a list, omits a list, or fences its JSON", effect: "strict schemas failed the plan or brief and with it the run", evidence: "PlanSchema and ExecutionBriefSchema were strict()", mitigation: "tolerant schemas plus tolerant JSON extraction; protected content restored deterministically", test: "test/robustness.test.ts, test/chaos.test.ts", status: tested}
  - {id: FM-033, trigger: "any structured stage answer unusable after repair", effect: "run failed although the real work was fine", evidence: "digest, analysis, plan and brief each failed differently in live runs", mitigation: "structuredStage policy with deterministic fallbacks and warnings", test: "test/chaos.test.ts (59 cases)", status: tested}
  - {id: FM-034, trigger: "specification or task text larger than a fixed cap", effect: "input budgets threw before the model was called; analysis and digest output caps failed real answers; OpenSpec style warnings failed runs after archive", evidence: "LOC-35 intent over 220 characters; LOC-36 requirement over 500 characters", mitigation: "generous input budgets, soft limit 10000 characters with warning, clamped descriptive text, cosmetic validation warnings ignored, analysis salvage", test: "test/handoffs.test.ts, test/openspec.test.ts", status: tested}
  - {id: FM-035, trigger: "change larger than the review diff limit", effect: "reviewer silently saw a truncated diff", evidence: "reviewPromptWithDiff sliced at 40000 characters", mitigation: "file list always included, truncation stated, limit 60000", test: "src/activities.ts REVIEW_DIFF_LIMIT", status: mitigated}
  - {id: FM-036, trigger: "real task longer than a provider default", effect: "implement stage capped at 15 minutes and 10 USD, OpenSpec at 12 minutes", evidence: "providerTimeouts max 900000 and Claude budget default 10", mitigation: "per-stage defaults (implement 30 min), manifest limit 4 hours, activity timeout 6 hours with heartbeats, Claude budget 25 USD", test: "test/untrusted-notice.test.ts", status: mitigated}
  - {id: FM-037, trigger: "Paperclip server or Docker VM unresponsive for minutes (heavy host load), controller lease (60s) lapses", effect: "Paperclip aborts the adapter, adapter cancelled a healthy Temporal workflow and killed a 10-minute Claude implementation (LOC-37)", evidence: "no Paperclip requests logged 00:55:33-01:04:51, abort reason 'Legacy controller lease lost'", mitigation: "adapter leaves the workflow running on lease loss, tolerates up to 60 failed polls; real cancels still cancel; deploy needs a Paperclip restart", test: "test/adapter-resilience.test.ts", status: tested-not-deployed}
  - {id: FM-038, trigger: "UI change that compiles and passes tests but renders wrongly (clipped, overlapping, indistinct states)", effect: "every textual gate passes and the defect reaches the PR", evidence: "first real capture of dino-runner after LOC-39 showed the jumping dinosaur's head clipped by the canvas top; Codex confirmed it from the screenshot", mitigation: "visual verification in the review activity (ADR 0007); capture problems warn, visual.required fails closed", test: "test/visual.test.ts, test/chaos.test.ts visual settings", status: tested-live-capture}
  - {id: FM-039, trigger: "OpenSpec delta uses MODIFIED for a requirement that is new (or ADDED for an existing one, REMOVED for a missing one)", effect: "run failed at the OpenSpec stage after a repair pass that did not address it (LOC-40); OpenSpec had its own bounded repair and no deterministic fallback, unlike the structured stages", evidence: "LOC-40 failed with: MODIFIED requirement does not exist in the main spec", mitigation: "normalizeDelta/repairDeltaFiles correct the operation mechanically before validation and report a warning per correction", test: "test/openspec-delta.test.ts mechanical delta correction", status: tested}
  - {id: FM-040, trigger: "structured data stored in Paperclip task text (the bootstrap form as raw JSON in a hidden comment)", effect: "Paperclip turned literal backslash-n sequences into newlines, JSON strings broke, and the first live bootstrap was refused with 'form is not valid JSON'", evidence: "live run LOC-47 (2026-10-23); stored description inspected through the API", mitigation: "form stored as base64url (src/bootstrap-form.ts, plugin src/form.ts); raw JSON still read for older tasks; description capped at 5000 characters", test: "test/bootstrap.test.ts (survives Paperclip normalisation), plugins/project-bootstrap/tests/plugin.test.ts", status: mitigated}
  - {id: FM-041, trigger: "read-only model stage run in a directory that is not a git repository", effect: "Codex refuses to start ('Not inside a trusted directory'), so every bootstrap stage would fail", evidence: "probe of the pinned Codex with the orchestrator's exact flags in an empty folder, before the first live run", mitigation: "the bootstrap sandbox is an initialised empty git repository (prepareBootstrapSandboxImpl)", test: "test/bootstrap.test.ts model sandbox", status: mitigated}
  - {id: FM-042, trigger: "docker compose recreate of the paperclip service on Windows with a read-only bind mount", effect: "'mount denied ... too many colons' while carrying volumes over from the old container; the old container keeps running", evidence: "docker compose up -d paperclip during the bootstrap deploy", mitigation: "stop gracefully (-t 60), docker compose rm -f paperclip, then docker compose up -d --no-build paperclip; data lives in data/paperclip", test: "runbook section 8", status: mitigated}
  - {id: FM-043, trigger: "machine off, asleep or offline while a workflow is running (adapter process dies, Temporal survives)", effect: "the workflow finished (draft PR published) but Paperclip never heard: the task was marked blocked with 'requires reconciliation' and the dependent tasks stayed waiting (LOC-65)", evidence: "live Aurora Store build 2026-10-23; the closed workflow held a needs_review result and PR #7", mitigation: "npm run reconcile (src/reconcile.ts): reports finished results to Paperclip idempotently, also run automatically at every worker start; completes FM-037's open 'reconcile command'", test: "test/reconcile.test.ts", status: mitigated}
  - {id: FM-044, trigger: "a task is run again (Paperclip's review path after in_review, a retry): the branch name includes the issue revision and attempt, so each run has its own branch", effect: "a second draft PR for the same task stayed open next to the first; after the user merged the reruns, the earlier attempts showed as conflicting PRs that would have reverted the fixes (Aurora Store #3/#6/#8)", evidence: "live build 2026-10-23; the same task ids appeared twice with different commit hashes", mitigation: "publishWorktree closes the open PRs of earlier runs of the same task (branch prefix and the exact 'Paperclip task: <id>' body line must both match), comments with a pointer, keeps the branches; the result records `superseded`", test: "test/supersede.test.ts", status: mitigated}
  - {id: FM-045, trigger: "a parallel plan (plan_mode=parallel) where two independent tasks change the same lines and a later task waits for both", effect: "the worker cannot merge the two blocker branches into the task's integration base, so the dependent task fails before any code runs", evidence: "designed from the first sequential live build, where parallel tasks conflicted on the shared files of a small app (test/stacking.test.ts conflict case)", mitigation: "buildIntegrationBase aborts the merge, removes the scratch worktree, pushes nothing and names the conflicting files; add a dependency between the two tasks in the plan (or resolve by hand); the default plan stays sequential and the planner is told to keep parallel tasks on separate files", test: "test/stacking.test.ts", status: mitigated}
